name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # P0.1: must build from a clean checkout (no stale .tsbuildinfo).
      - run: rm -rf packages/*/dist && npm run build
      - run: npm run typecheck
      - run: npm test
      # P5.3: harness on the frozen snapshot, then fixed gates.
      - run: npx tsx scripts/eval-pipeline.ts --n 10 --no-legacy --out /tmp/eval_pipeline_metrics.json
      - run: npx tsx scripts/eval/check-gates.ts --metrics /tmp/eval_pipeline_metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-pipeline-metrics
          path: /tmp/eval_pipeline_metrics.json
